name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful; let the newest push win.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json requires >=22.13.0. tests/verify.mjs also needs node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm run install:ci

      - name: Install browser bridge dependencies
        run: npm install --prefix browser-bridge --no-audit --no-fund

      - name: Install browser bridge Chromium
        run: npx --prefix browser-bridge playwright install --with-deps chromium

      - name: Browser bridge Chromium launch smoke test
        run: |
          cd browser-bridge
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const expected = chromium.executablePath();
          console.log(`Expected Chromium: ${expected}`);
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE

      - name: Migrations match db/schema.ts
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::db/schema.ts changed without a generated migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Test
        run: node tests/verify.mjs

      - name: Request origin regression tests
        run: node --test tests/request-origin.test.mjs

      - name: Front learning regression tests
        run: node --test tests/front-learning.test.mjs

      - name: Settings navigation regression tests
        run: node --test tests/settings-navigation.test.mjs

      - name: Front feed quality regression tests
        run: node --test tests/front-feed-quality.test.mjs

      - name: Browser bridge unit tests
        run: npm test --prefix browser-bridge

      - name: Legacy browser bridge health smoke test
        run: |
          node browser-bridge/src/server-v10.mjs > /tmp/front-bridge-v10.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill $BRIDGE_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:43981/health > /tmp/front-bridge-v10-health.json; then break; fi
            sleep 0.25
          done
          cat /tmp/front-bridge-v10.log || true
          node -e "const d=require('/tmp/front-bridge-v10-health.json');if(!d.ok||d.service!=='front-browser-bridge'||d.version!==10||d.scanner!=='for-you-adaptive')process.exit(1)"
          kill $BRIDGE_PID || true
          trap - EXIT

      - name: Viral Scout v16 health smoke test
        run: |
          rm -rf /tmp/front-v16-smoke
          FRONT_BRIDGE_PORT=43991 FRONT_BRIDGE_DATA=/tmp/front-v16-smoke node browser-bridge/src/server-v16.mjs > /tmp/front-bridge-v16.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill $BRIDGE_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:43991/health > /tmp/front-bridge-v16-health.json; then break; fi
            sleep 0.25
          done
          cat /tmp/front-bridge-v16.log || true
          node - <<'NODE'
          const d=require('/tmp/front-bridge-v16-health.json');
          const required=['signal-stop-scroll','viral-scout-skill','focus-first-investigation','measured-snapshot-velocity'];
          if(!d.ok||d.service!=='front-browser-bridge'||d.version!==16||d.scanner!=='viral-narrative-scout-v16'||!required.every((x)=>d.capabilities.includes(x)))process.exit(1);
          NODE
          kill $BRIDGE_PID || true
          trap - EXIT

      # verify.mjs replays the migrations through node:sqlite. This proves they
      # also apply through wrangler to a real D1, which is stricter (0002 uses
      # PRAGMA statements), and that the local dev database can be built at all.
      - name: Migrations apply to a local D1
        run: npm run db:migrate:local

      - name: Mounted D1 persistence path works
        run: |
          rm -rf /tmp/front-persist-test
          FRONT_PERSIST_DIR=/tmp/front-persist-test npm run db:migrate:local
          test -d /tmp/front-persist-test
          test -n "$(find /tmp/front-persist-test -type f -print -quit)"

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      # The reason this workflow exists: .openai/hosting.json was missing and every
      # one of these steps failed on a clean clone.
      - name: Build
        run: npm run build

      - name: Deploy bundle contains hosting config and migrations
        run: |
          test -f dist/.openai/hosting.json
          test -d dist/.openai/drizzle
