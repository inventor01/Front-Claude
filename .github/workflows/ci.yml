name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful; let the newest push win.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json requires >=22.13.0. tests/verify.mjs also needs node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm run install:ci

      - name: Install browser bridge dependencies
        run: npm install --prefix browser-bridge --no-audit --no-fund

      - name: Install browser bridge Chromium
        run: npx --prefix browser-bridge playwright install --with-deps chromium

      - name: Browser bridge Chromium launch smoke test
        run: |
          cd browser-bridge
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const expected = chromium.executablePath();
          console.log(`Expected Chromium: ${expected}`);
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE

      - name: Migrations match db/schema.ts
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::db/schema.ts changed without a generated migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Test
        run: node tests/verify.mjs

      - name: Request origin regression tests
        run: node --test tests/request-origin.test.mjs

      - name: Browser bridge unit tests
        run: npm test --prefix browser-bridge

      - name: Browser bridge health smoke test
        run: |
          node browser-bridge/src/server.mjs > /tmp/front-bridge.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill $BRIDGE_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:43981/health > /tmp/front-bridge-health.json; then break; fi
            sleep 0.25
          done
          node -e "const d=require('/tmp/front-bridge-health.json');if(!d.ok||d.service!=='front-browser-bridge')process.exit(1)"

      # verify.mjs replays the migrations through node:sqlite. This proves they
      # also apply through wrangler to a real D1, which is stricter (0002 uses
      # PRAGMA statements), and that the local dev database can be built at all.
      - name: Migrations apply to a local D1
        run: npm run db:migrate:local

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      # The reason this workflow exists: .openai/hosting.json was missing and every
      # one of these steps failed on a clean clone.
      - name: Build
        run: npm run build

      - name: Deploy bundle contains hosting config and migrations
        run: |
          test -f dist/.openai/hosting.json
          test -d dist/.openai/drizzle
