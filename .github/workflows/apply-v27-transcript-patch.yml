name: Apply v27 transcript integration

on:
  push:
    branches:
      - feature/v27-full-video-transcripts
    paths:
      - scripts/apply-v27-transcript-patch.py
      - scripts/fix-v27-patcher.py
      - .github/workflows/apply-v27-transcript-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v27-full-video-transcripts
          fetch-depth: 0
      - name: Repair patcher anchor
        run: python3 scripts/fix-v27-patcher.py
      - name: Apply integration patch
        run: python3 scripts/apply-v27-transcript-patch.py
      - name: Remove transient repair helper
        run: rm -f scripts/fix-v27-patcher.py
      - name: Syntax check v27 browser bridge
        run: |
          node --check browser-bridge/src/video-transcript-v27.mjs
          node --check browser-bridge/src/video-meaning-v27.mjs
          node --check browser-bridge/src/server-v25.mjs
          node --check browser-bridge/scripts/validate-v26-release.mjs
      - name: Install browser bridge dependencies
        run: npm install --prefix browser-bridge --no-audit --no-fund
      - name: Run browser bridge unit tests
        run: npm test --prefix browser-bridge
      - name: Commit integrated v27 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate exhaustive v27 video transcription"
          git push origin HEAD:feature/v27-full-video-transcripts
