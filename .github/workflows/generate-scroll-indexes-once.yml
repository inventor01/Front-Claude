name: Generate scroll queue indexes once

on:
  push:
    branches: [main]
    paths:
      - db/schema.ts
      - .github/workflows/generate-scroll-indexes-once.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Generate Drizzle migration
        run: npm run db:generate
      - name: Commit migration and metadata
        run: |
          if git diff --quiet -- drizzle/ && [ -z "$(git ls-files --others --exclude-standard drizzle/)" ]; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          git commit -m "Generate remote scroll queue index migration"
          git push
