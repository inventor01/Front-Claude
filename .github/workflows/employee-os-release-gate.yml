name: Employee OS Release Gate QA
on:
  push:
    branches: [front-commerce-dev]
    paths:
      - 'employee-os/**'
      - '.github/workflows/employee-os-release-gate.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_os_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: employee-os
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/employee_os_qa
      PGSSLMODE: disable
      JWT_SECRET: employee-os-ci-jwt-secret-at-least-32-bytes
      CREDENTIALS_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Migrate
        run: npm run migrate
      - name: Module 1-3 — ledger, email, social
        run: node tests/external-actions-sandbox.mjs
      - name: Module 4 — creative rendering idempotency
        run: node tests/runway-sandbox.mjs
      - name: Module 5 — Shopify safe-write + commerce
        run: node tests/commerce-sandbox.mjs
      - name: Module 6 — blocked-job resume
        run: node tests/resume-sandbox.mjs
      - name: Module 7 — manager handoff dedupe
        run: node tests/manager-handoff-dedupe.mjs
      - name: Module 8 — failure recovery and ambiguity safety
        run: node tests/failure-recovery-sandbox.mjs
      - name: Module 9 — Hoodies 4/4 aggregate external execution
        run: node tests/hoodies-release-gate-sandbox.mjs
